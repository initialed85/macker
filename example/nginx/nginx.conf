# Minimal foreground nginx configuration for the Darwin OCI experiment.
# The runtime starts nginx with -p ./ while its working directory is the
# extracted image rootfs, so relative paths stay inside the image.
daemon off;
worker_processes 1;
pid var/run/nginx.pid;
error_log stderr notice;

events {
    worker_connections 128;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        # Deliberately expose the image rootfs so this experiment can inspect
        # the files transported in the OCI layer.
        root .;
        autoindex on;
        autoindex_exact_size off;
    }
}
