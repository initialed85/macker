# Minimal foreground nginx configuration for a host-volume document root.
# The runtime starts nginx with -p ./ while its working directory is the
# extracted image rootfs, so this relative root resolves inside the image.
daemon off;
worker_processes 1;
pid var/run/nginx.pid;
error_log stderr notice;

events {
    worker_connections 128;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen ____MACKER_PORT_1____;
        server_name _;
        root usr/share/nginx/html;
        autoindex on;
        autoindex_exact_size off;
    }
}
