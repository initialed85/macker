# GitHub Release on every push to master. This is the port of .github/workflows/release.yml (deleted in
# the same commit), and it keeps that workflow's shape: a darwin/arm64 leg, then one publish with GitHub's
# generated notes. The darwin/amd64 leg GitHub Actions ran is deliberately gone. The Intel/Catalina target is
# the too-hard basket - the old Intel MacBook never came back up - so the only Mac artifact this repo ships
# is arm64. Bringing Intel back wants a machine to test on, not merely a cross-compile that nobody has run.
#
# Four translation notes, because GitHub Actions and Woodpecker differ in exactly the places this workflow
# cares about:
#
# 1. No matrix. GHA ran `strategy.matrix.include` over the two arches and stitched the legs back together
#    with upload-artifact/download-artifact. A Woodpecker `matrix:` multiplies the *whole workflow*, which
#    would run the publish step once per leg and publish two releases. Instead both legs write into the
#    same dist/ — steps of one workflow share a workspace on the k8s backend, which is how the publish step
#    sees both archives without an artifact store.
#
# 2. The tag cannot be the pipeline number. GHA built its tag as `build-` plus GitHub's run_number, and GitHub's
#    run_number for this repo is a counter that keeps climbing across every workflow that ever ran here.
#    Woodpecker's per-repo pipeline number restarts at 1, so `build-1` would either collide with an
#    existing tag or silently re-tag an old release (the plugin reuses the release for a tag rather than
#    failing). The number is therefore derived from the `build-N` tags that actually exist in the repo,
#    which is the same rule scripts/update.sh in macgrubernetes uses for component versions.
#
# 3. `generate_release_notes: true` and `files: dist/*.tar.gz` are softprops features, and the plugin only
#    grew them while this port was written: settings.generate_notes (home-ops
#    ci/woodpecker/plugins/gh-release) and glob expansion in settings.files. A pattern matching nothing is
#    fatal, which is what `if-no-files-found: error` meant.
#
# 4. One deliberate difference: GHA titled the release "Build N" from GitHub's run_number. settings: is not
#    expanded and cannot read a file, so a title derived during the build cannot reach the plugin; the
#    title is the tag (`build-N`). The tag is what users install from, the title is cosmetic.
#
# The Go toolchain here is the current one. 1.22 used to be pinned for the Intel leg because it is the last
# toolchain whose Darwin binaries run on macOS Catalina; that leg is gone, so the pin went with it.
#
# The token is the native k8s Secret woodpecker/github-token mapped to PLUGIN_TOKEN by
# backend_options.kubernetes.secrets (the Linux agents run with
# WOODPECKER_BACKEND_K8S_ALLOW_NATIVE_SECRETS=true). No credential appears in this file.
#
# What the publish step depends on, learned the hard way: it hands wp-gh-release a glob, and the plugin
# replaces any asset whose name already exists so a re-run cannot 422. That match is exact and client-side,
# because GitHub's list-assets endpoint accepts a `name` query parameter and ignores it - asking for one
# asset returns every asset on the release. An earlier revision deleted what it was handed, which is how
# maclet build-39 published a release holding a checksum and no 6.3 MB binary with a green pipeline.
steps:
  - name: resolve-build-number
    image: docker.io/library/golang:1.26.5
    commands:
      # --refs, not plain --tags: annotated tags appear twice otherwise (the ref and its peeled ^{} entry)
      # and `sed` on the ref column is enough to get the name. Written to a file so a failed or empty
      # ls-remote is a step failure instead of an empty variable that quietly produces build-1.
      - git ls-remote --tags --refs "https://github.com/$CI_REPO.git" > build-tags.txt
      - test -s build-tags.txt
      - sed -n 's#.*refs/tags/##p' build-tags.txt | grep -E '^build-[0-9]+$' | sort -V | tail -n 1 | sed 's#^build-##' > build-number.txt
      - test -s build-number.txt || echo 0 > build-number.txt
      - mkdir -p .build && echo "build-$(( $(cat build-number.txt) + 1 ))" > .build/TAG
      - echo "publishing $(cat .build/TAG), derived from the tags that already exist"
      - sed -n 's#.*refs/tags/##p' build-tags.txt | grep -E '^build-[0-9]+$' | sort -V | tail -n 3

  - name: build-darwin-arm64
    image: docker.io/library/golang:1.26.5
    depends_on: [resolve-build-number]
    commands:
      - go version
      # proxy.golang.org resets HTTP/2 streams under load and go does not retry; the retry reads from the
      # module cache, so it is free when the first attempt was fine.
      - go mod download || go mod download
      - go vet ./...
      - go test -count=1 ./...
      - sh -n test.sh
      - sh -n example/nginx/build-rootfs.sh
      - sh -n example/echo-server/build.sh
      # the cross-compile check GHA ran: a darwin test binary that does not even link is a build failure,
      # not a test failure, and it is not run here because an arm64 host cannot execute an amd64 one.
      - env GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/macker-arm64.test ./cmd/macker
      - mkdir -p dist/macker-darwin-arm64
      - env GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o dist/macker-darwin-arm64/macker ./cmd/macker
      # `file` is not installed in the golang image, so the format is asserted from the Mach-O header
      # instead: cffaedfe is MH_MAGIC_64 and the cputype that follows it, stored little-endian, is 0c000001
      # for arm64. GHA could call `file` because Ubuntu runners ship it; macker #4 died on
      # /bin/sh: file: not found in both legs before this replaced it.
      - head -c 12 dist/macker-darwin-arm64/macker | od -An -tx1 | tr -d ' ' | grep -q '^cffaedfe0c000001'
      - tar -C dist -czf dist/macker-darwin-arm64.tar.gz macker-darwin-arm64
      - (cd dist && sha256sum macker-darwin-arm64.tar.gz > macker-darwin-arm64.tar.gz.sha256)

  - name: release
    image: docker.io/initialed85/wp-gh-release:latest
    depends_on: [build-darwin-arm64]
    settings:
      tag_file: .build/TAG
      generate_notes: true
      files:
        - dist/*.tar.gz
        - dist/*.sha256
    backend_options:
      kubernetes:
        secrets:
          - name: github-token
            key: token
            target:
              env: PLUGIN_TOKEN

when:
  - event: push
    branch: master
