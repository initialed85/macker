name: Release

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build darwin/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go 1.22 is the last Go release whose Darwin binaries run on
          # macOS Catalina; use it for the Intel artifact.
          - arch: amd64
            go-version: '1.22.12'
          - arch: arm64
            go-version: '1.26.5'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check source
        run: |
          go test ./...
          go vet ./...
          sh -n test.sh
          sh -n example/nginx/build-rootfs.sh
          sh -n example/echo-server/build.sh

      - name: Cross-compile Darwin tests
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: go test -c -o /tmp/macker-${{ matrix.arch }}.test ./cmd/macker

      - name: Build Darwin binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/macker-darwin-${{ matrix.arch }}
          go build -o dist/macker-darwin-${{ matrix.arch }}/macker ./cmd/macker
          file dist/macker-darwin-${{ matrix.arch }}/macker

      - name: Package binaries
        run: |
          tar -C dist -czf macker-darwin-${{ matrix.arch }}.tar.gz macker-darwin-${{ matrix.arch }}
          sha256sum macker-darwin-${{ matrix.arch }}.tar.gz > macker-darwin-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macker-darwin-${{ matrix.arch }}
          path: |
            macker-darwin-${{ matrix.arch }}.tar.gz
            macker-darwin-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: macker-darwin-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
